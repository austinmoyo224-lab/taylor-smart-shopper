// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Release builds don't need lint/annotation extraction for library modules.
// These tasks pull huge extra jars (lint-checks, kotlin-compiler) from
// dl.google.com and routinely fail on slow/unstable connections.
subprojects {
    tasks.configureEach { task ->
        if (task.name.startsWith("extract") && task.name.endsWith("Annotations")) {
            task.enabled = false
        }
        if (task.name.startsWith("lint")) {
            task.enabled = false
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
